baseURL = "https://crow0077.github.io/xhuljano-tech-blog/"
languageCode = "en-us"
title = "Xhuljano"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false

[pagination]
  pagerSize = 10

[params]
  env = "production"
  description = "I direct AI agents to build and verify useful systems across a three-machine homelab. Explore an interactive architecture and selected work."
  author = "Xhuljano Caushllari"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Crow0077"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/xhuljano-caushllari-125076157/"
  [[params.socialIcons]]
    name = "mail"
    url = "mailto:xcaushlari@gmail.com"

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = true
    codeFences = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "projects"
    name = "Work"
    url = "/projects/"
    weight = 10
  [[menu.main]]
    identifier = "ai-news"
    name = "AI News"
    url = "/ai-news/"
    weight = 15
