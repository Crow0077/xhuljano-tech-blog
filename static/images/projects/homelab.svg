<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title"><title id="title">Homelab architecture: control, compute, and durable services are separate roles</title><style>:root{--bg:oklch(17% .014 226);--ink:oklch(94% .009 215);--muted:oklch(76% .012 215);--rule:oklch(36% .017 225);--accent:oklch(79% .10 173)}rect{fill:var(--bg);stroke:var(--rule)}text{fill:var(--ink);font-family:system-ui,sans-serif}.muted{fill:var(--muted)}.accent{fill:var(--accent)}path,line{fill:none;stroke:var(--accent);stroke-width:2}.label{font-family:monospace;font-size:18px;letter-spacing:1px}</style><rect width="720" height="400" stroke="none"/><text x="32" y="40" font-size="18" class="label muted">HOMELAB / THREE ROLES</text><rect x="32" y="100" width="184" height="170" rx="2"/><text x="50" y="146" font-size="27" class="">Node A</text><text x="50" y="184" font-size="23" class="accent">Control</text><line x1="50" y1="214" x2="142" y2="214" style="stroke:var(--rule)"/><line x1="50" y1="226" x2="142" y2="226" style="stroke:var(--rule)"/><line x1="50" y1="238" x2="142" y2="238" style="stroke:var(--rule)"/><rect x="268" y="100" width="184" height="170" rx="2"/><text x="286" y="146" font-size="27" class="">Node B</text><text x="286" y="184" font-size="23" class="accent">Compute</text><line x1="286" y1="214" x2="378" y2="214" style="stroke:var(--rule)"/><line x1="286" y1="226" x2="378" y2="226" style="stroke:var(--rule)"/><line x1="286" y1="238" x2="378" y2="238" style="stroke:var(--rule)"/><rect x="504" y="100" width="184" height="170" rx="2"/><text x="522" y="146" font-size="27" class="">Pavilion</text><text x="522" y="184" font-size="23" class="accent">Services</text><line x1="522" y1="214" x2="614" y2="214" style="stroke:var(--rule)"/><line x1="522" y1="226" x2="614" y2="226" style="stroke:var(--rule)"/><line x1="522" y1="238" x2="614" y2="238" style="stroke:var(--rule)"/><path d="M124 270V308H596V270M360 270V308"/><text x="32" y="358" font-size="21" cla