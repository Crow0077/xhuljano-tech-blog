<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title"><title id="title">Claimcheck architecture: transcript claims matched to tool evidence for review</title><style>:root{--bg:oklch(17% .014 226);--ink:oklch(94% .009 215);--muted:oklch(76% .012 215);--rule:oklch(36% .017 225);--accent:oklch(79% .10 173)}rect{fill:var(--bg);stroke:var(--rule)}text{fill:var(--ink);font-family:system-ui,sans-serif}.muted{fill:var(--muted)}.accent{fill:var(--accent)}path,line{fill:none;stroke:var(--accent);stroke-width:2}.label{font-family:monospace;font-size:18px;letter-spacing:1px}</style><rect width="720" height="400" stroke="none"/><text x="32" y="40" font-size="18" class="label muted">CLAIMCHECK / EVIDENCE FLOW</text><rect x="32" y="85" width="264" height="215" rx="2"/><text x="52" y="122" font-size="28" class="">Transcript</text><text x="52" y="169" font-size="23" class="">Action claim</text><text x="52" y="205" font-size="23" class="muted">Tool arguments</text><text x="52" y="241" font-size="23" class="muted">Tool result</text><path d="M296 190H408m-10-7 10 7-10 7"/><text x="318" y="171" font-size="18" class="accent">match</text><rect x="424" y="85" width="264" height="215" rx="2"/><text x="444" y="122" font-size="28" class="">Report</text><text x="444" y="169" font-size="23" class="">Claim + status</text><text x="444" y="205" font-size="23" class="muted">Evidence notes</text><text x="444" y="241" font-size="23" class="muted">Review needed</text><text x="32" y="358" font-size="21" class="muted">Heuristic matching, not a correctness proof.</text></svg>
