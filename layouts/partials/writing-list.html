<div class="writing-list">
{{ range (where site.RegularPages "Section" "posts").ByDate.Reverse }}
<article><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time><div><h3><a href="{{ .RelPermalink }}">{{ .Title }} <span aria-hidden="true">↗</span></a></h3><p>{{ .Description }}</p></div></article>
{{ end }}
</div>
