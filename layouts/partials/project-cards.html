<div class="project-grid">
  {{ range (where site.RegularPages "Section" "projects").ByWeight }}
  <article class="project-card">
    <a class="project-image" href="{{ .RelPermalink }}" aria-label="{{ .Title }} case study"><img src="{{ .Params.diagram | relURL }}" alt="{{ .Params.diagramAlt }}" width="720" height="400" loading="lazy"></a>
    <div class="project-card-copy"><p class="work-note">{{ .Params.projectType }}</p><h3><a href="{{ .RelPermalink }}">{{ .Title }} <span aria-hidden="true">↗</span></a></h3><p>{{ .Description }}</p><a class="text-link" href="{{ .RelPermalink }}">Read case study →</a></div>
  </article>
  {{ end }}
</div>
